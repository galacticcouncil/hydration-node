[profile.release]
panic = 'unwind'

[workspace]
members = [
    'node',
    'node/cerebro-core/core',
    'node/cerebro-core/hydration',
    'runtime/hydradx',
    'pallets/omnipool',
    'pallets/dca',
    'primitives',
    'utils/build-script-utils',
    'integration-tests',
    'pallets/circuit-breaker',
    'pallets/omnipool-liquidity-mining',
    'scraper',
    'traits',
    'pallets/relaychain-info',
    'pallets/route-executor',
    'pallets/transaction-multi-payment',
    'pallets/asset-registry',
    'runtime/adapters',
    'pallets/collator-rewards',
    'pallets/collator-rotation',
    'pallets/transaction-pause',
    'pallets/ema-oracle',
    'pallets/liquidity-mining',
    'pallets/currencies',
    'pallets/currencies/rpc/runtime-api',
    'pallets/stableswap',
    'utils/test-utils',
    'pallets/dynamic-fees',
    'pallets/duster',
    'pallets/otc',
    'pallets/otc-settlements',
    'pallets/bonds',
    'pallets/lbp',
    'pallets/nft',
    'math',
    'pallets/staking',
    'runtime/hydradx/src/evm/evm-utility/macro',
    'pallets/referrals',
    'pallets/evm-accounts',
    'pallets/dynamic-evm-fee',
    'pallets/xyk-liquidity-mining',
    'pallets/liquidation',
    'precompiles/call-permit',
    'precompiles/flash-loan',
    'precompiles/lock-manager',
    'runtime-mock',
    'pallets/broadcast',
    'liquidation-worker-support',
    'pallets/hsm',
    'pallets/signet',
    'pallets/dispenser',
    'pallets/lazy-executor',
    'pallets/intent',
    'pallets/ice',
    'pallets/ice/support',
    'pallets/ice/runtime-api',
    'ice/ice-solver',
    'ice/solver-bench',
    'pallets/ice/amm-simulator',
    "pallets/fee-processor",
    "pallets/gigahdx",
    "pallets/gigahdx-rewards",
    'pepl-worker',
    'pepl-worker/support',
]

resolver = "2"

[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }
# the node reads the chain's own runtime metadata to decode events; already in the graph
# via frame-support, pinned here so the node can name the types.
frame-metadata = { version = "23.0.1", default-features = false, features = ["current", "decode"] }
serde = { version = "1.0.209", default-features = false }
primitive-types = { version = "0.13.1", default-features = false }
borsh = { version = "1.5.7", default-features = false, features = ["derive"] }

# ICE
ice-solver = { path = "ice/ice-solver", default-features = false}
route-findr= { path = "ice/route-findr", default-features = false }


affix = "0.1.2"
alloy-primitives = { version = "0.7", default-features = false }
alloy-sol-types = { version = "0.7", default-features = false }
approx = "0.5.1"
async-trait = "0.1"
bitflags = "1.3.2"
cargo-lock = "10.0.1"
case = "1.0"
clap = { version = "4.1.8", features = ["derive"] }
criterion = "0.5.1"
derive_more = "0.99.18"
environmental = { version = "1.1.2", default-features = false }
ethabi = { git = "https://github.com/AcalaNetwork/ethabi", branch = "acala", default-features = false }
